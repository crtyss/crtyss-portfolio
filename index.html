<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f2" />
    <script>
      (() => {
        let theme = 'light'
        try { if (localStorage.getItem('crtyss-theme') === 'dark') theme = 'dark' } catch {}
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f3f3f2' : '#101214'
      })()
    </script>
    <link rel="stylesheet" href="/src/theme.css" />
    <meta
      name="description"
      content="Crtyss，产品设计师。专注于产品造型、三维表达与真实使用体验。"
    />
    <title>Crtyss - 产品设计师</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
