server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/lin-studio;
    index index.html;
    client_max_body_size 26m;
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
    }
    location / {
        try_files $uri /index.html;
    }
}
